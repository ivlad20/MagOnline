# MagOnline backend for local development: MySQL + Spring Boot.
#   docker compose up -d --build     start everything (the first build takes a few minutes)
#   docker compose logs -f backend   backend logs
#   docker compose down              stop (data is kept in the volume)
#   docker compose down -v           stop and wipe data (the seed is reloaded on the next up)
#
# These passwords are for local development only; override them in a .env file next to this one.

services:
  db:
    image: mysql:8.4
    container_name: magonline-db
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: magonline_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-magonline_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-magonline_root_local}
    ports:
      - "3307:3306" # 3307 on the host so it doesn't clash with a locally installed MySQL
    volumes:
      - db-data:/var/lib/mysql
      - ./server/spring-boot-jdbc-app/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/spring-boot-jdbc-app/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./server/spring-boot-jdbc-app
    container_name: magonline-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: magonline_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-magonline_local}
      APP_STORAGE: local
      APP_STORAGE_LOCAL_DIR: /app/uploads
      APP_PUBLIC_URL: http://localhost:8088
    ports:
      - "8088:8080" # 8080 on the host is taken by other software
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
